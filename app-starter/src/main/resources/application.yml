server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smart-life
  profiles:
    include: core
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.yxtech.smartlife: INFO

app:
  admin-auth:
    session-key-prefix: "smart-life:admin:session:"
    session-ttl-minutes: 120
  file-storage:
    upload-dir: uploads
    public-path: /uploads/**
    public-url-prefix: /uploads/
    max-file-size: 5242880
