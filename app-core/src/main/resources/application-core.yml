spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_life?useLocalSessionState=true&autoReconnectForPools=true&useServerPrepStmts=false&rewriteBatchedStatements=true&serverTimezone=GMT%2b8&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
